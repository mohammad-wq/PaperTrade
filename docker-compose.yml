services:
  db:
    image: postgres:16-alpine
    container_name: papertrade-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-papertrade}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-papertrade}"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: papertrade-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-papertrade}?schema=public
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-me}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-Paper Trade}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      BUSINESS_NAME: ${BUSINESS_NAME:-Paper Trade Co.}
      BUSINESS_ADDRESS: ${BUSINESS_ADDRESS:-Shop floor & Main Warehouse}
      BUSINESS_PHONE: ${BUSINESS_PHONE:-+92 300 1234567}
      BUSINESS_EMAIL: ${BUSINESS_EMAIL:-owner@example.com}
      OWNER_EMAIL: ${OWNER_EMAIL:-owner@example.com}
      SEED_OWNER_EMAIL: ${SEED_OWNER_EMAIL:-owner@example.com}
      SEED_OWNER_PASSWORD: ${SEED_OWNER_PASSWORD:-ChangeMe123!}
    volumes:
      - ./backups:/app/backups

volumes:
  postgres_data:
    driver: local

